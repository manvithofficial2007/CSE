<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – Blood Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
</head>
<body>

<div class="auth-page">

  <div class="auth-card">

    <a class="auth-logo" href="index.html">
      <span class="brand-icon" aria-hidden="true">🩸</span>
      Blood Bridge
    </a>

    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-subheading">Sign in to your Blood Bridge account</p>

    <!-- Alert container -->
    <div id="login-alert" class="alert alert-danger" style="display:none; margin-bottom:16px;" role="alert"></div>

    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="login-email">Email address <span class="required">*</span></label>
        <input
          class="form-control"
          type="email"
          id="login-email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <span class="field-error" id="login-email-error"></span>
      </div>

      <div class="form-group">
        <label for="login-password">Password <span class="required">*</span></label>
        <div class="input-group">
          <input
            class="form-control"
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <span class="input-group-icon" id="toggle-login-pwd" role="button" aria-label="Show/hide password" tabindex="0">👁</span>
        </div>
        <span class="field-error" id="login-password-error"></span>
      </div>

      <div style="display:flex; justify-content:flex-end; margin-top:-10px; margin-bottom:18px;">
        <a href="#" style="font-size:13px; color:var(--color-primary);">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>

    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--color-border-light); text-align:center;">
      <a href="admin-login.html" style="font-size:13px; color:var(--color-text-muted);">Admin login →</a>
    </div>
  </div>

  <!-- Demo mode note -->
  <div style="margin-top:16px; font-size:12px; color:var(--color-text-muted); text-align:center; max-width:360px;">
    <strong>Demo mode:</strong> Enter any email and a password of 4+ characters to sign in with sample data.
  </div>

</div>

<div id="toast-container" aria-live="polite"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
